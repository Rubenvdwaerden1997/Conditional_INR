# 2D ablation of the 2.5D U-Net run (config_3D_residualunet2p5d_encoder*_skipconnections.yaml): IDENTICAL
# except patch_z: 16 -> 1. Same ResidualUNet2p5D class (its stem takes patch_z input channels, so 1 channel =
# plain 2D U-Net). Single annotated frame in, same frame supervised.
# ============================
# General Settings
# ============================
env: "cluster"   #"local" or "cluster"
training_mode: "3D"   # unused by train_unet.py's dataset construction logic path, kept for schema consistency
save_root: "/data/diag/rubenvdw/Conditional_INR/saved_models_unet2D_conditional"
experiment_name: "residualunet2d_encoder64_depth5_zarrstore_skipconnections"

seed: 42
device: "cuda"   # or "cpu"

# ============================
# Data Settings
# ============================
# Identical to config_3D_residualunet2p5d_encoder64_depth5_zarrstore.yaml (the no-skip run) --
# the ONLY difference in this file is dense_decoder_skip_connections: True below. This isolates
# "does giving the U-Net real skip connections help" as its own single-variable comparison,
# separate from the no-skip-vs-INR comparison the other config was built for.
paths:
  local:
    data_root: ["W:/rubenvdw/Dataset/3D_Grayscale_Circmask_ForegroundZNorm_Dicoms_Segmentations_12classes_31072026"]
    split_excel: "W:/rubenvdw/Info_files_Dataset_split/Multiclass_segmentations_stratifiedsplit_28112025_newnamings15012026.xlsx"
    patches_folder_3d: "W:/rubenvdw/Conditional_INR/Patches_preprocessed_3D_foregroundnorm"
    zarr_store: "W:/rubenvdw/Dataset/Grayscale_Circmask_Unnormalized_OctFmZarrStore_17classes_30092026"
    zarr_local_cache: ""
  cluster:
    data_root: ["/data/diag/rubenvdw/Dataset/3D_Grayscale_Circmask_ForegroundZNorm_Dicoms_Segmentations_12classes_31072026"]
    split_excel: "/data/diag/rubenvdw/Info_files_Dataset_split/Multiclass_segmentations_stratifiedsplit_28112025_newnamings15012026.xlsx"
    patches_folder_3d: "/data/diag/rubenvdw/Conditional_INR/Patches_preprocessed_3D_foregroundnorm"
    zarr_store: "/data/diag/rubenvdw/Dataset/Grayscale_Circmask_Unnormalized_OctFmZarrStore_17classes_30092026"
    zarr_local_cache: "/mnt/jobcache/oct_fm_store"
train_batch_size: 2

# ============================
# Model Settings
# ============================
# Same as the no-skip config, plus dense_decoder_skip_connections: True -- gives the dense 2D
# decoder real UNet-style skip connections from encoder layer1(H/2)/layer2(H/4)/layer3(H/8)/
# layer4(H/16) instead of no-skip upsampling (requires encoder_depth=5, asserted in model.py).
model_seg_decoder:
  out_channels: 12
  feature_size: 64
  encoder_depth: 5          # required for skip connections (ResidualUNet2p5D asserts this)
  global_feat_ch: 64
  dilation_xy: 1
  encoder_type: "2.5d"
  dense_decoder_skip_connections: True
  mapping_activated: True
  mapping:
    0: 0 # Background
    1: 1 # Lumen
    2: 2 # Guidewire
    3: 3 # Intima
    4: 4 # Lipid
    5: 5 # Calcium
    6: 6 # Media
    7: 1 # Catheter
    8: 7 # Sidebranch
    9: 8 # Red thrombus
    10: 8 # White thrombus
    11: 3 # Dissection
    12: 9 # Plaque rupture
    13: 10 # Layered plaque
    14: 11 # Neovascularization
    15: 3 # Intraplaque hemorrhage
    16: 3 # Intramural hematoma

# ============================
# Training Settings
# ============================
training_segmentation:
  epochs: 300
  warmup_epochs: 5
  lr_settings:
    initial_lr: 0.0003
    weight_decay: 0.0001
  val_interval: 5
  ignore_index: 255
  ignore_background: True
  patch_z: 1    # single-frame 2D input (was 16 for the 2.5D run); z-jitter is moot with one frame
  resize_to: 512
  n_points: 524288   # unused by the U-Net itself, still read by dataset construction (coords are discarded)
  use_amp: False
  grad_clip_norm: 0.0
  max_batches_frac: 0.25
  val_interval_pct: 0.05
  # Raised from the defaults (8/4/2) per supervisor's advice after seeing DataWait% in the
  # training log -- more parallel DataLoader workers and a deeper per-worker prefetch queue
  # reduce GPU idle time if the zarr read + per-pullback-norm + z-jitter pipeline can't keep
  # up. Matching --cpus-per-task=13 in the .sh (12 workers + 1 main process) is required.
  num_workers: 12
  val_num_workers: 6
  prefetch_factor: 4
