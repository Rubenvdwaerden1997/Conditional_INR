# ============================
# General Settings
# ============================
env: "cluster"   #"local" or "cluster"
training_mode: "3D"   # "2D" trains on annotated frames only; "3D" trains on full volumes
save_root: "/data/diag/rubenvdw/Conditional_INR/saved_models_3D_conditional"
experiment_name: "conditional_3D_relu_cedice_trilinear_encoder16_depth5_nodense_zarrstore_perpullbacknorm_zjitter_perframe_inrhidden8"

seed: 42
device: "cuda"   # or "cpu"

# ============================
# Data Settings
# ============================
# Identical to the encoder16 3D INR baseline (experiment
# conditional_3D_relu_cedice_trilinear_encoder16_depth5_nodense_zarrstore_perpullbacknorm_zjitter_perframe,
# Val Dice 0.4834, inr_hidden=128) except inr_hidden: 128 -> 8 below. INR-size sweep at a FIXED
# encoder (feature_size/global_feat_ch=16, encoder_depth=5, inr_depth=4): only inr_hidden varies
# ({8,16,32,64,128,256}; 128 is the existing baseline run). Same sweep as the encoder32 one
# (..._encoder32_..._inrhidden*.yaml), reaching a lower total-parameter range (~27k-256k).
paths:
  local:
    data_root: ["W:/rubenvdw/Dataset/3D_Grayscale_Circmask_ForegroundZNorm_Dicoms_Segmentations_12classes_31072026"]
    split_excel: "W:/rubenvdw/Info_files_Dataset_split/Multiclass_segmentations_stratifiedsplit_28112025_newnamings15012026.xlsx"
    patches_folder_3d: "W:/rubenvdw/Conditional_INR/Patches_preprocessed_3D_foregroundnorm"
    zarr_store: "W:/rubenvdw/Dataset/Grayscale_Circmask_Unnormalized_OctFmZarrStore_17classes_30092026"
    zarr_local_cache: ""
  cluster:
    data_root: ["/data/diag/rubenvdw/Dataset/3D_Grayscale_Circmask_ForegroundZNorm_Dicoms_Segmentations_12classes_31072026"]
    split_excel: "/data/diag/rubenvdw/Info_files_Dataset_split/Multiclass_segmentations_stratifiedsplit_28112025_newnamings15012026.xlsx"
    patches_folder_3d: "/data/diag/rubenvdw/Conditional_INR/Patches_preprocessed_3D_foregroundnorm"
    zarr_store: "/data/diag/rubenvdw/Dataset/Grayscale_Circmask_Unnormalized_OctFmZarrStore_17classes_30092026"
    zarr_local_cache: "/mnt/jobcache/oct_fm_store"
train_batch_size: 2

# ============================
# Model Settings
# ============================
model_seg_decoder:
  out_channels: 12
  feature_size: 16          # fixed -- encoder is NOT the swept variable here
  use_local_features: True
  use_dense_decoder: False
  dense_decoder_skip_connections: False
  encoder_depth: 5          # fixed across the whole width sweep -- depth is not the variable here
  use_intermediate_features: False
  global_feat_ch: 16        # matches feature_size
  dilation_xy: 1
  encoder_z_strides: [1, 1, 2, 1, 1]   # Z downsamples once, centered (at layer3) -- matches the medium baseline
  feature_sampling: "trilinear"
  inr_hidden: 8           # the swept variable (baseline = 128)
  inr_depth: 4
  inr_activation: "relu"
  siren_omega_0: 30.0
  num_freqs_xy: 4
  num_freqs_z: 4
  mapping_activated: True
  mapping:
    0: 0 # Background
    1: 1 # Lumen
    2: 2 # Guidewire
    3: 3 # Intima
    4: 4 # Lipid
    5: 5 # Calcium
    6: 6 # Media
    7: 1 # Catheter
    8: 7 # Sidebranch
    9: 8 # Red thrombus
    10: 8 # White thrombus
    11: 3 # Dissection
    12: 9 # Plaque rupture
    13: 10 # Layered plaque
    14: 11 # Neovascularization
    15: 3 # Intraplaque hemorrhage
    16: 3 # Intramural hematoma

# ============================
# Training Settings
# ============================
training_segmentation:
  epochs: 300
  warmup_epochs: 5
  lr_settings:
    initial_lr: 0.0003
    weight_decay: 0.0001
  val_interval: 5
  ignore_index: 255
  ignore_background: True
  feature_supervision: False
  tv_loss_weight: 0.0
  smoothness_3d_weight: 0.0
  smoothness_2d_weight: 0.0
  smoothness_2d_n_pairs: 1024
  smoothness_class_indices: [0,1,3,4,5,6,7,10]
  patch_z: 16
  resize_to: 512
  sampling_strategy: "random"
  background_floor_frac: 0.0
  n_points: 524288
  preload_data: False
  preload_frac: 0.3
  use_amp: False
  grad_clip_norm: 0.0
  loss_type: "ce_dice"
  dense_decoder_weight: 1.0
  max_batches_frac: 0.25
  val_interval_pct: 0.05
  num_workers: 12
  val_num_workers: 6
  prefetch_factor: 4
