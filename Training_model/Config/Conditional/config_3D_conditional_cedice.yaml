# ============================
# General Settings
# ============================
env: "cluster"   #"local" or "cluster"
training_mode: "3D"   # "2D" trains on annotated frames only; "3D" trains on full volumes
save_root: "/data/diag/rubenvdw/Conditional_INR/saved_models_3D_conditional"
experiment_name: "conditional_3D_siren_cedice_liif"

seed: 42
device: "cuda"   # or "cpu"

# ============================
# Data Settings
# ============================
paths:
  local:
    data_root: ["W:/rubenvdw/Dataset/3D_Grayscale_Circularmask_Zscorenorm_Dicoms_Segmentations_16012026"]
    split_excel: "W:/rubenvdw/Info_files_Dataset_split/Multiclass_segmentations_stratifiedsplit_28112025_newnamings15012026.xlsx"
    patches_folder_3d: "W:/rubenvdw/Conditional_INR/Patches_preprocessed_3D"
  cluster:
    data_root: ["/data/diag/rubenvdw/Dataset/3D_Grayscale_Circularmask_Zscorenorm_Dicoms_Segmentations_16012026"]
    split_excel: "/data/diag/rubenvdw/Info_files_Dataset_split/Multiclass_segmentations_stratifiedsplit_28112025_newnamings15012026.xlsx"
    patches_folder_3d: "/data/diag/rubenvdw/Conditional_INR/Patches_preprocessed_3D"
train_batch_size: 1

# ============================
# Model Settings
# ============================
model_seg_decoder:
  out_channels: 12   # Number of segmentation classes
  feature_size: 16          # Number of channels in features fed to INR (default 16); higher = more capacity but harder to train
  use_local_features: True   # True = LIIF nearest-cell sampling; all pixels in same encoder cell share one feature
  use_dense_decoder: False  # no decoder for this experiment — INR only
  use_intermediate_features: False   # not used by ResNetEncoder3D
  global_feat_ch: 64               # global context vector size (AdaptiveAvgPool → Linear → [B, global_feat_ch])
  dilation_xy: 1                   # 1 = standard conv; >1 = dilated last stage (wider receptive field, no extra stride)
  encoder_z_strides: [1, 2, 1]    # per-layer Z stride [layer1, layer2, layer3]; 2 = stride+3x3x3 kernel at that layer
  feature_sampling: "liif"        # "trilinear" or "liif" (nearest-cell, reduces per-pixel FiLM specificity)
  inr_hidden: 128                  # hidden units per INR MLP layer
  inr_depth: 4                     # number of INR MLP layers (min 2)
  inr_activation: "siren"          # "relu" or "siren" (Sitzmann et al. 2020)
  siren_omega_0: 30.0              # only used when inr_activation="siren"
  num_freqs_xy: 4                  # Fourier frequencies for x/y
  num_freqs_z: 4                   # Fourier frequencies for z (fewer — coarser z axis)
  mapping_activated: True
  mapping:
    0: 0 # Background
    1: 1 # Lumen
    2: 2 # Guidewire
    3: 3 # Intima
    4: 4 # Lipid
    5: 5 # Calcium
    6: 6 # Media
    7: 1 # Catheter
    8: 7 # Sidebranch
    9: 8 # Red thrombus
    10: 8 # White thrombus
    11: 3 # Dissection
    12: 9 # Plaque rupture
    13: 10 # Layered plaque
    14: 11 # Neovascularization
    15: 3 # Intraplaque hemorrhage
    16: 3 # Intramural hematoma

# ============================
# Training Settings
# ============================
training_segmentation:
  epochs: 300
  warmup_epochs: 5        # LR ramps from initial_lr*0.1 → initial_lr over these epochs
  lr_settings:
    initial_lr: 0.0003
    weight_decay: 0.0001
  val_interval: 5   # Validate every n epochs
  ignore_index: 255       # Sentinel for truly unlabeled pixels; must not equal any real class (0-11)
  ignore_background: True  # Exclude class 0 (background) from Dice loss
  feature_supervision: False        # Not used in 3D mode (full_label is always empty)
  tv_loss_weight: 0.0               # TV loss disabled — weight 1.0 overwhelmed CE/Dice in Test 4
  smoothness_3d_weight: 0.0         # 3D temporal: penalises class changes between consecutive z-frames. Enable AFTER 2D quality is good.
  smoothness_2d_weight: 0.0        # 2D spatial: penalises adjacent (x,y) pixel disagreement on annotated frame. Enable to reduce pixelation.
  smoothness_2d_n_pairs: 1024        # coordinate pairs sampled per step for 2D spatial smoothness
  smoothness_class_indices: [0,1,3,4,5,6,7,10]      # Classes both smoothness losses apply to; empty = all classes
  patch_z: 16                       # z-frames per 3D training patch (centered on annotated frame)
  resize_to: 512                    # resize (H,W) to 512×512 at load time (bilinear image / nearest label)
  sampling_strategy: "random"       # "random" or "stratified" (equal samples per present class)
  background_floor_frac: 0.0            # min fraction of n_pts guaranteed to be background (0.0 = disabled)
  n_points: 524288                         # query coordinates sampled per volume per step (8192, 16384, 32768)
  preload_data: False                     # load patch files into RAM at startup (needs ~1.5x dataset size in --mem)
  preload_frac: 0.3                      # fraction loaded upfront (0.0–1.0); remainder is lazily cached during training
  use_amp: False                          # AMP float16 overflows with SIREN ω₀=30 → silent skipped steps; disable or use bfloat16
  grad_clip_norm: 0.0                     # gradient clip L2 norm (0.0 = disabled); SIREN init already bounds magnitudes
  loss_type: "ce_dice"                    # "ce_dice" or "mse_onehot" (MSE between softmax probs and one-hot targets)
  dense_decoder_weight: 0.0               # CE loss weight for the dense decoder head
  max_batches_frac: 0.00                  # 25% of patches per epoch → ~7 min/epoch instead of 28 min
  val_interval_pct: 0.05                  # validate every 5% of total epochs → ~20 checkpoints for 300 epochs
