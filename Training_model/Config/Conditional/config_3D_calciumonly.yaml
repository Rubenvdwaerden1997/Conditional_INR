# ============================
# General Settings
# ============================
env: "cluster"   #"local" or "cluster"
training_mode: "3D"   # "2D" trains on annotated frames only; "3D" trains on full volumes
save_root: "/data/diag/rubenvdw/Conditional_INR/saved_models_3D_binarycalcium"
experiment_name: "First_test_calciumonly"

seed: 42
device: "cuda"   # or "cpu"

# ============================
# Data Settings
# ============================
paths:
  local:
    data_root: ["W:/rubenvdw/Dataset/3D_Grayscale_Circularmask_Zscorenorm_Dicoms_Segmentations_16012026"]
    split_excel: "W:/rubenvdw/Info_files_Dataset_split/Multiclass_segmentations_stratifiedsplit_28112025_newnamings15012026.xlsx"
    patches_folder_3d: "W:/rubenvdw/Conditional_INR/Patches_preprocessed_3D_calciumonly"
  cluster:
    data_root: ["/data/diag/rubenvdw/Dataset/3D_Grayscale_Circularmask_Zscorenorm_Dicoms_Segmentations_16012026"]
    split_excel: "/data/diag/rubenvdw/Info_files_Dataset_split/Multiclass_segmentations_stratifiedsplit_28112025_newnamings15012026.xlsx"
    patches_folder_3d: "/data/diag/rubenvdw/Conditional_INR/Patches_preprocessed_3D_calciumonly"
train_batch_size: 4

# ============================
# Model Settings
# ============================
model_seg_decoder:
  out_channels: 2   # Number of segmentation classes
  feature_size: 96
  use_intermediate_features: True   # sample stem/enc2/enc3 at each query; adds 7b dims to INR input
  inr_hidden: 256                  # hidden units per INR MLP layer (default 512)
  inr_depth: 4                     # number of INR MLP layers (min 2)
  num_freqs_xy: 6                  # Fourier frequencies for x/y (reduce to 4 for smoother predictions)
  mapping_activated: True
  mapping:
    0: 0 # Background
    1: 0 # Lumen
    2: 0 # Guidewire
    3: 0 # Intima
    4: 0 # Lipid
    5: 1 # Calcium
    6: 0 # Media
    7: 0 # Catheter
    8: 0 # Sidebranch
    9: 0 # Red thrombus
    10: 0 # White thrombus
    11: 0 # Dissection
    12: 0 # Plaque rupture
    13: 0 # Layered plaque
    14: 0 # Neovascularization
    15: 0 # Intraplaque hemorrhage
    16: 0 # Intramural hematoma

# ============================
# Training Settings
# ============================
training_segmentation:
  epochs: 100
  warmup_epochs: 5        # LR ramps from initial_lr*0.1 → initial_lr over these epochs
  lr_settings:
    initial_lr: 0.0003
    weight_decay: 0.0001
  val_interval: 5   # Validate every n epochs
  ignore_index: 255  # Sentinel for truly unlabeled pixels; must not equal any real class (0-11)
  feature_supervision: False        # Not used in 3D mode (full_label is always empty)
  tv_loss_weight: 0.0               # TV loss disabled — weight 1.0 overwhelmed CE/Dice in Test 4
  smoothness_3d_weight: 1.0         # 3D temporal: penalises class changes between consecutive z-frames
  smoothness_2d_weight: 0.0        # 2D spatial: penalises adjacent (x,y) pixel disagreement on annotated frame
  smoothness_2d_n_pairs: 64        # coordinate pairs sampled per step for 2D spatial smoothness
  smoothness_class_indices: []      # Empty = all classes; list class indices to restrict (e.g. [0,1,3] to exclude stent class 2)
  patch_z: 32                       # z-frames per 3D training patch (centered on annotated frame)
  resize_to: 0                      # if > 0, resize (H,W) to this at load time (bilinear image / nearest label); 0 = native 704
  sampling_strategy: "stratified"       # "random" or "stratified" (equal samples per present class)
  background_floor_frac: 0.0            # disabled for binary: pure stratified (50/50) is correct here
  n_points: 8192                        # query coordinates sampled per volume per step
  preload_data: false                   # load all patch files into RAM at startup (needs ~1.5x dataset size in --mem)