# ============================
# General Settings
# ============================
env: "cluster"   #"local" or "cluster"
training_mode: "3D"   # "2D" trains on annotated frames only; "3D" trains on full volumes
save_root: "/data/diag/rubenvdw/Conditional_INR/saved_models_3D_conditional"
experiment_name: "conditional_3D_relu_cedice_trilinear_encoder64_depth5_nodense_zarrstore_perpullbacknorm_zjitter_perframe_ms_l14_mid"

seed: 42
device: "cuda"   # or "cpu"

# ============================
# Data Settings
# ============================
# Identical model/training settings to config_..._foregroundnorm.yaml (the current best,
# Val Dice 0.6525) -- the only difference is the data-loading backend, for a direct
# apples-to-apples comparison. zarr_store (non-empty) makes main.py build the dataset via
# OCTPullbackDataset.from_zarr() instead of from_excel()/data_root -- see dataset.py/main.py.
# data_root/patches_folder_3d are left pointing at the old pipeline's folders but are UNUSED
# whenever zarr_store is set (main.py checks cfg.zarr_store before cfg.patches_folder_3d).
# split_excel is still read once by main.py regardless of backend (cheap, used for the
# unconditional-mode branch too) so it must stay a valid path even though from_zarr() itself
# reads the split/manual-frames straight from the store's own pullbacks.parquet, not this Excel.
# zarr_local_cache (cluster only): node-local scratch dir main.py rsyncs the store into once per
# job before training, mirroring oct-fm's train_seg.sbatch -- network-storage reads are the
# bottleneck otherwise. Left empty for local (no such mount), so local runs just read zarr_store
# directly.
paths:
  local:
    data_root: ["W:/rubenvdw/Dataset/3D_Grayscale_Circmask_ForegroundZNorm_Dicoms_Segmentations_12classes_31072026"]
    split_excel: "W:/rubenvdw/Info_files_Dataset_split/Multiclass_segmentations_stratifiedsplit_28112025_newnamings15012026.xlsx"
    patches_folder_3d: "W:/rubenvdw/Conditional_INR/Patches_preprocessed_3D_foregroundnorm"
    zarr_store: "W:/rubenvdw/Dataset/Grayscale_Circmask_Unnormalized_OctFmZarrStore_17classes_30092026"
    zarr_local_cache: ""
  cluster:
    data_root: ["/data/diag/rubenvdw/Dataset/3D_Grayscale_Circmask_ForegroundZNorm_Dicoms_Segmentations_12classes_31072026"]
    split_excel: "/data/diag/rubenvdw/Info_files_Dataset_split/Multiclass_segmentations_stratifiedsplit_28112025_newnamings15012026.xlsx"
    patches_folder_3d: "/data/diag/rubenvdw/Conditional_INR/Patches_preprocessed_3D_foregroundnorm"
    zarr_store: "/data/diag/rubenvdw/Dataset/Grayscale_Circmask_Unnormalized_OctFmZarrStore_17classes_30092026"
    zarr_local_cache: "/mnt/jobcache/oct_fm_store"
train_batch_size: 2

# ============================
# Model Settings
# ============================
model_seg_decoder:
  out_channels: 12
  feature_size: 64          # bigger encoder: 64 channels instead of 16 (~150k encoder params vs 11k)
  use_local_features: True
  use_dense_decoder: False  # isolates the data-backend change on the depth5+relu baseline -- no auxiliary CNN loss
  dense_decoder_skip_connections: False   # irrelevant when use_dense_decoder is False
  encoder_depth: 5          # matches depth5_nodense_relu (current best) -- only change vs it is the data backend
  use_intermediate_features: True
  multiscale_inject: "mid"   # "mid" = midpoint only, "input" = first layer (+ midpoint via skip), "all" = every hidden-width layer
  multiscale_levels: [1, 4]   # encoder levels injected (1 = finest H/2 ... 4 = coarsest H/16)
  global_feat_ch: 64
  dilation_xy: 1
  encoder_z_strides: [1, 1, 2, 1, 1]   # Z downsamples once, centered (at layer3) -- matches depth5_nodense_relu
  feature_sampling: "trilinear"
  inr_hidden: 128
  inr_depth: 4
  inr_activation: "relu"   # Fourier PE + concatenated features -> ReLU MLP, no periodic SIREN/FiLM
  siren_omega_0: 30.0      # unused when inr_activation="relu"
  num_freqs_xy: 4
  num_freqs_z: 4
  mapping_activated: True
  mapping:
    0: 0 # Background
    1: 1 # Lumen
    2: 2 # Guidewire
    3: 3 # Intima
    4: 4 # Lipid
    5: 5 # Calcium
    6: 6 # Media
    7: 1 # Catheter
    8: 7 # Sidebranch
    9: 8 # Red thrombus
    10: 8 # White thrombus
    11: 3 # Dissection
    12: 9 # Plaque rupture
    13: 10 # Layered plaque
    14: 11 # Neovascularization
    15: 3 # Intraplaque hemorrhage
    16: 3 # Intramural hematoma

# ============================
# Training Settings
# ============================
training_segmentation:
  epochs: 300
  warmup_epochs: 5
  lr_settings:
    initial_lr: 0.0003
    weight_decay: 0.0001
  val_interval: 5
  ignore_index: 255
  ignore_background: True
  feature_supervision: False
  tv_loss_weight: 0.0
  smoothness_3d_weight: 0.0
  smoothness_2d_weight: 0.0
  smoothness_2d_n_pairs: 1024
  smoothness_class_indices: [0,1,3,4,5,6,7,10]
  patch_z: 16
  resize_to: 512
  sampling_strategy: "random"
  background_floor_frac: 0.0
  n_points: 524288
  preload_data: False
  preload_frac: 0.3
  use_amp: False
  grad_clip_norm: 0.0
  loss_type: "ce_dice"
  dense_decoder_weight: 1.0   # unused when use_dense_decoder is False
  max_batches_frac: 0.25
  val_interval_pct: 0.05
  # Raised from the defaults (8/4/2) per supervisor's advice after seeing DataWait% in the
  # training log -- more parallel DataLoader workers and a deeper per-worker prefetch queue
  # reduce GPU idle time if the zarr read + per-pullback-norm + z-jitter pipeline can't keep
  # up. Matching --cpus-per-task=13 in the .sh (12 workers + 1 main process) is required.
  num_workers: 12
  val_num_workers: 6
  prefetch_factor: 4
