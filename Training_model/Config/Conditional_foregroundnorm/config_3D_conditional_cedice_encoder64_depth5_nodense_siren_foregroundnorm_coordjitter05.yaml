# ============================
# General Settings
# ============================
env: "cluster"   #"local" or "cluster"
training_mode: "3D"   # "2D" trains on annotated frames only; "3D" trains on full volumes
save_root: "/data/diag/rubenvdw/Conditional_INR/saved_models_3D_conditional"
experiment_name: "conditional_3D_siren_cedice_trilinear_encoder64_depth5_nodense_foregroundnorm_coordjitter05"

seed: 42
device: "cuda"   # or "cpu"

# ============================
# Data Settings
# ============================
# Same as config_..._depth5_nodense_relu_foregroundnorm_coordjitter05.yaml (foreground-only
# z-score normalized data + sub-pixel coord jitter at sample time) but with inr_activation
# switched from "relu" to "siren" -- isolates the decoder-activation variable on top of the
# current best relu+foregroundnorm+coordjitter recipe.
paths:
  local:
    data_root: ["W:/rubenvdw/Dataset/3D_Grayscale_Circmask_ForegroundZNorm_Dicoms_Segmentations_12classes_31072026"]
    split_excel: "W:/rubenvdw/Info_files_Dataset_split/Multiclass_segmentations_stratifiedsplit_28112025_newnamings15012026.xlsx"
    patches_folder_3d: "W:/rubenvdw/Conditional_INR/Patches_preprocessed_3D_foregroundnorm"
  cluster:
    data_root: ["/data/diag/rubenvdw/Dataset/3D_Grayscale_Circmask_ForegroundZNorm_Dicoms_Segmentations_12classes_31072026"]
    split_excel: "/data/diag/rubenvdw/Info_files_Dataset_split/Multiclass_segmentations_stratifiedsplit_28112025_newnamings15012026.xlsx"
    patches_folder_3d: "/data/diag/rubenvdw/Conditional_INR/Patches_preprocessed_3D_foregroundnorm"
train_batch_size: 2

# ============================
# Model Settings
# ============================
model_seg_decoder:
  out_channels: 12
  feature_size: 64          # bigger encoder: 64 channels instead of 16 (~150k encoder params vs 11k)
  use_local_features: True
  use_dense_decoder: False  # isolates the foreground-norm + coord-jitter + siren combo on the depth5 baseline — no auxiliary CNN loss
  dense_decoder_skip_connections: False   # irrelevant when use_dense_decoder is False
  encoder_depth: 5          # matches depth5_nodense_relu (current best) — only change vs it is inr_activation + data preprocessing + coord_jitter_max
  use_intermediate_features: False   # not yet implemented for encoder_depth=5 (INR path unaffected either way)
  global_feat_ch: 64
  dilation_xy: 1
  encoder_z_strides: [1, 1, 2, 1, 1]   # Z downsamples once, centered (at layer3) — matches depth5_nodense_relu
  feature_sampling: "trilinear"
  inr_hidden: 128
  inr_depth: 4
  inr_activation: "siren"   # only change vs the relu baseline — FiLM-conditioned SIREN decoder instead of Fourier PE + ReLU MLP
  siren_omega_0: 30.0       # standard SIREN default (see config_..._omega15.yaml for the omega=15 variant tried previously)
  num_freqs_xy: 4
  num_freqs_z: 4
  mapping_activated: True
  mapping:
    0: 0 # Background
    1: 1 # Lumen
    2: 2 # Guidewire
    3: 3 # Intima
    4: 4 # Lipid
    5: 5 # Calcium
    6: 6 # Media
    7: 1 # Catheter
    8: 7 # Sidebranch
    9: 8 # Red thrombus
    10: 8 # White thrombus
    11: 3 # Dissection
    12: 9 # Plaque rupture
    13: 10 # Layered plaque
    14: 11 # Neovascularization
    15: 3 # Intraplaque hemorrhage
    16: 3 # Intramural hematoma

# ============================
# Training Settings
# ============================
training_segmentation:
  epochs: 300
  warmup_epochs: 5
  lr_settings:
    initial_lr: 0.0003
    weight_decay: 0.0001
  val_interval: 5
  ignore_index: 255
  ignore_background: True
  feature_supervision: False
  tv_loss_weight: 0.0
  smoothness_3d_weight: 0.0
  smoothness_2d_weight: 0.0
  smoothness_2d_n_pairs: 1024
  smoothness_class_indices: [0,1,3,4,5,6,7,10]
  # Sub-pixel coordinate jitter -- see config_..._depth5_nodense_relu_foregroundnorm_coordjitter05.yaml
  # for the full reasoning. z untouched, hard labels kept unchanged, validation always uses
  # exact pixel centers regardless of this setting.
  coord_jitter_max: 0.5
  patch_z: 16
  resize_to: 512
  sampling_strategy: "random"
  background_floor_frac: 0.0
  n_points: 524288
  preload_data: False
  preload_frac: 0.3
  use_amp: False
  grad_clip_norm: 0.0   # matches the depth5_nodense_relu baseline exactly — clean single-variable comparison
  loss_type: "ce_dice"
  dense_decoder_weight: 1.0   # unused when use_dense_decoder is False
  max_batches_frac: 0.25
  val_interval_pct: 0.05
