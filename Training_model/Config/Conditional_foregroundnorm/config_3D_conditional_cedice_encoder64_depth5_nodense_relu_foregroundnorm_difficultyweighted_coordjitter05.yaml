# ============================
# General Settings
# ============================
env: "cluster"   #"local" or "cluster"
training_mode: "3D"   # "2D" trains on annotated frames only; "3D" trains on full volumes
save_root: "/data/diag/rubenvdw/Conditional_INR/saved_models_3D_conditional"
experiment_name: "conditional_3D_relu_cedice_trilinear_encoder64_depth5_nodense_foregroundnorm_difficultyweighted_coordjitter05"

seed: 42
device: "cuda"   # or "cpu"

# ============================
# Data Settings
# ============================
# Identical to config_..._foregroundnorm_difficultyweighted.yaml (difficulty-weighted query-point
# sampling, lambda=0.5) plus sub-pixel coord jitter at sample time (see
# config_..._foregroundnorm_coordjitter05.yaml) -- combines the two untested meeting ideas rather
# than isolating either alone, since the user chose to test them together here.
#   sampling: weight(pixel of class c) = difficulty_lambda * boundary_closeness(pixel)
#                                        + (1 - difficulty_lambda) * (1 - dice_c)
#   coord jitter: after a pixel is chosen, its (x, y) query coordinate is offset by a fresh
#     uniform draw from [-0.5, +0.5] px (z untouched, hard label unchanged) -- see
#     coord_jitter_max below for the full rationale.
# patches_folder_3d reuses the SAME foregroundnorm patches folder as both parent runs --
# neither difficulty_weighted sampling nor coord_jitter_max touch preprocessing, only
# dataset.py's _sample_coords/_weighted_sample at train time.
paths:
  local:
    data_root: ["W:/rubenvdw/Dataset/3D_Grayscale_Circmask_ForegroundZNorm_Dicoms_Segmentations_12classes_31072026"]
    split_excel: "W:/rubenvdw/Info_files_Dataset_split/Multiclass_segmentations_stratifiedsplit_28112025_newnamings15012026.xlsx"
    patches_folder_3d: "W:/rubenvdw/Conditional_INR/Patches_preprocessed_3D_foregroundnorm"
  cluster:
    data_root: ["/data/diag/rubenvdw/Dataset/3D_Grayscale_Circmask_ForegroundZNorm_Dicoms_Segmentations_12classes_31072026"]
    split_excel: "/data/diag/rubenvdw/Info_files_Dataset_split/Multiclass_segmentations_stratifiedsplit_28112025_newnamings15012026.xlsx"
    patches_folder_3d: "/data/diag/rubenvdw/Conditional_INR/Patches_preprocessed_3D_foregroundnorm"
train_batch_size: 2

# ============================
# Model Settings
# ============================
model_seg_decoder:
  out_channels: 12
  feature_size: 64          # bigger encoder: 64 channels instead of 16 (~150k encoder params vs 11k)
  use_local_features: True
  use_dense_decoder: False
  dense_decoder_skip_connections: False   # irrelevant when use_dense_decoder is False
  encoder_depth: 5
  use_intermediate_features: False   # not yet implemented for encoder_depth=5 (INR path unaffected either way)
  global_feat_ch: 64
  dilation_xy: 1
  encoder_z_strides: [1, 1, 2, 1, 1]   # Z downsamples once, centered (at layer3)
  feature_sampling: "trilinear"
  inr_hidden: 128
  inr_depth: 4
  inr_activation: "relu"   # Fourier PE + concatenated features -> ReLU MLP, no periodic SIREN/FiLM
  siren_omega_0: 30.0      # unused when inr_activation="relu"
  num_freqs_xy: 4
  num_freqs_z: 4
  mapping_activated: True
  mapping:
    0: 0 # Background
    1: 1 # Lumen
    2: 2 # Guidewire
    3: 3 # Intima
    4: 4 # Lipid
    5: 5 # Calcium
    6: 6 # Media
    7: 1 # Catheter
    8: 7 # Sidebranch
    9: 8 # Red thrombus
    10: 8 # White thrombus
    11: 3 # Dissection
    12: 9 # Plaque rupture
    13: 10 # Layered plaque
    14: 11 # Neovascularization
    15: 3 # Intraplaque hemorrhage
    16: 3 # Intramural hematoma

# ============================
# Training Settings
# ============================
training_segmentation:
  epochs: 300
  warmup_epochs: 5
  lr_settings:
    initial_lr: 0.0003
    weight_decay: 0.0001
  val_interval: 5
  ignore_index: 255
  ignore_background: True
  feature_supervision: False
  tv_loss_weight: 0.0
  smoothness_3d_weight: 0.0
  smoothness_2d_weight: 0.0
  smoothness_2d_n_pairs: 1024
  smoothness_class_indices: [0,1,3,4,5,6,7,10]
  # Sub-pixel coordinate jitter (same as config_..._foregroundnorm_coordjitter05.yaml). At train
  # time, offsets each sampled query point's (x, y) by a fresh uniform draw from [-0.5, +0.5] px --
  # the full pixel footprint, every position inside the pixel equally likely. z untouched. The
  # pixel's own hard label is kept unchanged regardless of the offset (no soft/blended labels).
  # Validation always uses exact pixel centers regardless of this setting (dataset.py's
  # _sample_coords only jitters when mode=="train"), so Val Dice stays directly comparable to
  # every prior run in the table.
  coord_jitter_max: 0.5
  patch_z: 16
  resize_to: 512
  sampling_strategy: "difficulty_weighted"   # + coord_jitter_max above -- the two changes vs the plain foregroundnorm baseline
  difficulty_lambda: 0.5                     # equal blend of boundary-closeness and inverse-Dice
  background_floor_frac: 0.0
  n_points: 524288
  preload_data: False
  preload_frac: 0.3
  use_amp: False
  grad_clip_norm: 0.0
  loss_type: "ce_dice"
  dense_decoder_weight: 1.0   # unused when use_dense_decoder is False
  max_batches_frac: 0.25
  val_interval_pct: 0.05
