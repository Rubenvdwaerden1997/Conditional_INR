# ============================
# General Settings
# ============================
env: "cluster"   #"local" or "cluster"
training_mode: "3D"   # "2D" trains on annotated frames only; "3D" trains on full volumes
save_root: "/data/diag/rubenvdw/Conditional_INR/saved_models_3D_conditional"
experiment_name: "conditional_3D_relu_cedice_trilinear_encoder64_depth3_nodense_foregroundnorm_res256"

seed: 42
device: "cuda"   # or "cpu"

# ============================
# Data Settings
# ============================
# Identical to config_3D_conditional_cedice_encoder64_depth5_nodense_relu_foregroundnorm.yaml
# (plain foregroundnorm baseline, resize_to=512, no coord jitter, no tversky) except resize_to
# and encoder_depth below. Follow-up to the _res256 (depth5) run: that run underperformed the
# res512 baseline (best Val Dice 0.578 vs 0.635, plateaued) -- root cause read as the bottleneck
# cell becoming physically too coarse: encoder_depth=5 always downsamples 5x (H/32) regardless
# of input size, so at 256 input the bottleneck is 8x8 (each cell = 1/8 of frame width) vs
# 16x16 at 512 input (1/16 of frame width) -- twice as coarse, same failure mode already
# documented for encoder_depth=7 at 512 (bottleneck too coarse relative to fine wall structures
# like media/lipid/calcium). This run drops encoder_depth to 3 (H/8 bottleneck) so the 256-input
# bottleneck is 32x32 (1/32 of frame width) -- finer than the res512/depth5 baseline's cell
# fraction, isolating whether a shallower encoder recovers accuracy at the smaller input size.
# Still tests the multi-resolution query idea: encoder trains on a smaller (256x256) input; at
# inference, query the INR coordinates on the native 704x704 grid via
# `predict_singlepullback_conditional.py --query_resolution 704` (decode_3d/normalize_coords_3d
# already decouple query-coordinate resolution from encoder-input resolution -- see model.py).
paths:
  local:
    data_root: ["W:/rubenvdw/Dataset/3D_Grayscale_Circmask_ForegroundZNorm_Dicoms_Segmentations_12classes_31072026"]
    split_excel: "W:/rubenvdw/Info_files_Dataset_split/Multiclass_segmentations_stratifiedsplit_28112025_newnamings15012026.xlsx"
    patches_folder_3d: "W:/rubenvdw/Conditional_INR/Patches_preprocessed_3D_foregroundnorm"
  cluster:
    data_root: ["/data/diag/rubenvdw/Dataset/3D_Grayscale_Circmask_ForegroundZNorm_Dicoms_Segmentations_12classes_31072026"]
    split_excel: "/data/diag/rubenvdw/Info_files_Dataset_split/Multiclass_segmentations_stratifiedsplit_28112025_newnamings15012026.xlsx"
    patches_folder_3d: "/data/diag/rubenvdw/Conditional_INR/Patches_preprocessed_3D_foregroundnorm"
train_batch_size: 2

# ============================
# Model Settings
# ============================
model_seg_decoder:
  out_channels: 12
  feature_size: 64          # bigger encoder: 64 channels instead of 16 (~150k encoder params vs 11k)
  use_local_features: True
  use_dense_decoder: False
  dense_decoder_skip_connections: False   # irrelevant when use_dense_decoder is False
  encoder_depth: 3          # shallower than the res512 baseline (5) -- see Data Settings comment above
  use_intermediate_features: False   # not yet implemented for encoder_depth=5 (INR path unaffected either way)
  global_feat_ch: 64
  dilation_xy: 1
  encoder_z_strides: [1, 2, 1]   # depth3 convention: single Z downsample, centered (at layer2)
  feature_sampling: "trilinear"
  inr_hidden: 128
  inr_depth: 4
  inr_activation: "relu"   # Fourier PE + concatenated features -> ReLU MLP, no periodic SIREN/FiLM
  siren_omega_0: 30.0      # unused when inr_activation="relu"
  num_freqs_xy: 4
  num_freqs_z: 4
  mapping_activated: True
  mapping:
    0: 0 # Background
    1: 1 # Lumen
    2: 2 # Guidewire
    3: 3 # Intima
    4: 4 # Lipid
    5: 5 # Calcium
    6: 6 # Media
    7: 1 # Catheter
    8: 7 # Sidebranch
    9: 8 # Red thrombus
    10: 8 # White thrombus
    11: 3 # Dissection
    12: 9 # Plaque rupture
    13: 10 # Layered plaque
    14: 11 # Neovascularization
    15: 3 # Intraplaque hemorrhage
    16: 3 # Intramural hematoma

# ============================
# Training Settings
# ============================
training_segmentation:
  epochs: 300
  warmup_epochs: 5
  lr_settings:
    initial_lr: 0.0003
    weight_decay: 0.0001
  val_interval: 5
  ignore_index: 255
  ignore_background: True
  feature_supervision: False
  tv_loss_weight: 0.0
  smoothness_3d_weight: 0.0
  smoothness_2d_weight: 0.0
  smoothness_2d_n_pairs: 1024
  smoothness_class_indices: [0,1,3,4,5,6,7,10]
  patch_z: 16
  resize_to: 256   # only change vs the plain foregroundnorm res512 baseline (besides encoder_depth)
                    # -- encoder input downsampled further; labels/loss also computed on this 256
                    # grid during training (dataset.py resizes volume+labels together).
                    # Native-resolution querying happens only at inference time via predict
                    # script's --query_resolution flag. No coord_jitter_max, no tversky -- kept
                    # identical to the plain baseline so this isolates only the resolution +
                    # encoder_depth change.
  sampling_strategy: "random"
  background_floor_frac: 0.0
  n_points: 524288
  preload_data: False
  preload_frac: 0.3
  use_amp: False
  grad_clip_norm: 0.0
  loss_type: "ce_dice"
  dense_decoder_weight: 1.0   # unused when use_dense_decoder is False
  max_batches_frac: 0.25
  val_interval_pct: 0.05
